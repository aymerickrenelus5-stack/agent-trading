name: Rapport du matin

on:
  schedule:
    # Du lundi au vendredi à 6 h 20 UTC = 8 h 20 à Paris (7 h 20 en hiver).
    # GitHub peut avoir quelques minutes de retard.
    - cron: "20 6 * * 1-5"
  workflow_dispatch:   # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agent-trading
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Scanner les marchés (gratuit, sans clé API)
        run: python trading_agent.py --sans-ia --pas-ouvrir

      - name: Sauvegarder la mémoire de l'agent et le rapport
        run: |
          # garder les 60 derniers rapports HTML dans le dépôt (l'historique Git conserve le reste)
          ls -1 rapports/rapport_*.html 2>/dev/null | sort | head -n -60 | xargs -r rm -f
          git config user.name "agent-trading[bot]"
          git config user.email "agent-trading@users.noreply.github.com"
          git add -A
          git commit -q -m "Rapport du $(date +%F)" || echo "Rien à sauvegarder"
          git pull -q --rebase
          git push -q

  site:
    needs: rapport
    if: ${{ vars.RAPPORT_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Construire le site
        run: python trading_agent.py --site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4

  notification:
    needs: [rapport, site]
    if: ${{ always() && needs.rapport.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Envoyer le résumé sur le téléphone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAPPORT_URL: ${{ vars.RAPPORT_URL }}
        run: python trading_agent.py --notifier

  alerte:
    needs: rapport
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Prévenir que le rapport a échoué
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -H "Title: Rapport trading : echec" -H "Tags: warning" -H "Click: $LIEN" \
            -d "Le rapport du jour n'a pas pu etre genere. Touche pour voir le detail sur GitHub." \
            "https://ntfy.sh/$NTFY_TOPIC"
